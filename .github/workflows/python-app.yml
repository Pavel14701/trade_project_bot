name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [account_events, ai, api_okx_v1, main_app, strategies]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          # Проверяем наличие группы dev в pyproject.toml
          if grep -q '^\[dependency-groups.dev\]' pyproject.toml 2>/dev/null; then
            uv sync --group dev
          else
            uv sync
            # Устанавливаем mypy и ruff в то же виртуальное окружение через uv pip
            uv pip install mypy ruff
          fi
      - name: Run Mypy
        working-directory: ./${{ matrix.service }}
        run: uv run mypy . --explicit-package-bases --ignore-missing-imports
      - name: Run Ruff
        working-directory: ./${{ matrix.service }}
        run: uv run ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [account_events, ai, api_okx_v1, main_app, strategies]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          if grep -q '^\[dependency-groups.dev\]' pyproject.toml 2>/dev/null; then
            uv sync --group dev
          else
            uv sync
            # Если pytest не в основных зависимостях, доустанавливаем
            uv pip install pytest
          fi
      - name: Run pytest
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            uv run pytest tests
          else
            echo "No tests for ${{ matrix.service }}, skipping..."
          fi